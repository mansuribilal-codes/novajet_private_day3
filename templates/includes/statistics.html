{% load static %}
<section class="section-wrapper" style="padding: 60px 0;" id="statistics">
  <div class="container">
    <div class="stats-container">
      <div class="grid-4">
        <!-- Stat 1 -->
        <div class="stat-item">
          <div class="stat-number" data-target="150" data-suffix="+">0</div>
          <div class="stat-label">Vetted Global Fleet</div>
        </div>

        <!-- Stat 2 -->
        <div class="stat-item">
          <div class="stat-number" data-target="5000" data-suffix="+">0</div>
          <div class="stat-label">Private FBO Terminals</div>
        </div>

        <!-- Stat 3 -->
        <div class="stat-item">
          <div class="stat-number" data-target="99.8" data-suffix="%" data-decimal="true">0</div>
          <div class="stat-label">On-Time Dispatch Rate</div>
        </div>

        <!-- Stat 4 -->
        <div class="stat-item">
          <div class="stat-number" data-target="2" data-prefix="< " data-suffix="h">0</div>
          <div class="stat-label">Tarmac Readiness</div>
        </div>
      </div>
    </div>
  </div>
</section>
